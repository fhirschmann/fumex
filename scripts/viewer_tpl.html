<meta charset="utf-8">
<title>__TITLE__</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500;600&display=swap">
<style>
:root{
  --ground:#e9edf0; --surface:#ffffff; --surface-2:#f3f6f8;
  --ink:#141b21; --ink-2:#4a5b66; --ink-3:#7d8f9b;
  --rule:#ccd6dd; --rule-strong:#a9b8c2;
  --accent:#0b6e8f; --accent-soft:#d6e9f0;
  --shadow:0 1px 2px rgba(20,27,33,.08);
  --canvas-a:#dde4e9; --canvas-b:#c6d1d9;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --ground:#0d1317; --surface:#141d23; --surface-2:#1a252c;
    --ink:#e6edf1; --ink-2:#9fb2bd; --ink-3:#6d818d;
    --rule:#26343d; --rule-strong:#3a4c57;
    --accent:#4fb6d8; --accent-soft:#12313d;
    --shadow:0 1px 2px rgba(0,0,0,.4);
    --canvas-a:#0f171c; --canvas-b:#1b2830;
  }
}
:root[data-theme="dark"]{
  --ground:#0d1317; --surface:#141d23; --surface-2:#1a252c;
  --ink:#e6edf1; --ink-2:#9fb2bd; --ink-3:#6d818d;
  --rule:#26343d; --rule-strong:#3a4c57;
  --accent:#4fb6d8; --accent-soft:#12313d;
  --shadow:0 1px 2px rgba(0,0,0,.4);
  --canvas-a:#0f171c; --canvas-b:#1b2830;
}
*{box-sizing:border-box}
body{margin:0;background:var(--ground);color:var(--ink);
  font-family:"IBM Plex Sans",system-ui,-apple-system,"Segoe UI",sans-serif;
  font-size:14px;line-height:1.5;height:100vh;overflow:hidden}
.app{display:grid;grid-template-columns:300px 1fr;height:100vh}
@media (max-width:820px){
  .app{grid-template-columns:1fr;grid-template-rows:minmax(0,1fr) auto}
  .side{order:2;max-height:46vh;border-right:none;border-top:1px solid var(--rule)}
  .stage{order:1}
}
.side{background:var(--surface);border-right:1px solid var(--rule);
  display:flex;flex-direction:column;min-height:0}
.head{padding:18px 18px 14px;border-bottom:1px solid var(--rule);flex:none}
.eyebrow{font-family:"IBM Plex Mono",ui-monospace,monospace;font-size:10.5px;
  letter-spacing:.13em;text-transform:uppercase;color:var(--ink-3);margin:0 0 6px}
h1{margin:0;font-size:18px;font-weight:600;letter-spacing:-.01em;text-wrap:balance}
.dims{margin:10px 0 0;display:flex;gap:14px;font-family:"IBM Plex Mono",ui-monospace,monospace;
  font-size:11.5px;color:var(--ink-2);font-variant-numeric:tabular-nums}
.dims:empty{display:none}
.dims b{display:block;color:var(--ink);font-weight:500;font-size:13px}
.dims span{font-size:10px;letter-spacing:.08em;text-transform:uppercase;color:var(--ink-3)}
.tools{padding:12px 18px;border-bottom:1px solid var(--rule);flex:none;
  display:flex;flex-direction:column;gap:10px}
.presets{display:flex;gap:6px;flex-wrap:wrap}
button.preset{font:inherit;font-size:11.5px;padding:5px 10px;border-radius:3px;
  border:1px solid var(--rule-strong);background:var(--surface-2);color:var(--ink-2);cursor:pointer}
button.preset:hover{border-color:var(--accent);color:var(--accent)}
button.preset:focus-visible{outline:2px solid var(--accent);outline-offset:1px}
.slider{display:flex;align-items:center;gap:9px}
.slider label{font-family:"IBM Plex Mono",ui-monospace,monospace;font-size:10.5px;
  letter-spacing:.1em;text-transform:uppercase;color:var(--ink-3);flex:none}
.slider input{flex:1;accent-color:var(--accent)}
.slider select{font:inherit;font-size:11.5px;padding:2px 4px;border-radius:3px;
  border:1px solid var(--rule-strong);background:var(--surface-2);color:var(--ink-2)}
.slider button.preset{padding:2px 8px}
.slider input:disabled,.slider button:disabled{opacity:.4;cursor:default}
.preset.off{opacity:.45}
.slider output{font-family:"IBM Plex Mono",ui-monospace,monospace;font-size:11.5px;
  color:var(--ink-2);min-width:34px;text-align:right;font-variant-numeric:tabular-nums}
.list{overflow-y:auto;flex:1;min-height:0;padding-bottom:8px}
.grouphead{position:sticky;top:0;background:var(--surface);z-index:1;
  padding:12px 18px 5px;font-family:"IBM Plex Mono",ui-monospace,monospace;
  font-size:10px;letter-spacing:.13em;text-transform:uppercase;color:var(--ink-3);
  border-bottom:1px solid var(--rule)}
.row{display:grid;grid-template-columns:16px 10px 1fr auto;gap:9px;align-items:center;
  padding:6px 18px;cursor:pointer;border-bottom:1px solid transparent}
.row:hover{background:var(--surface-2)}
.row input{margin:0;accent-color:var(--accent);cursor:pointer}
.row:focus-within{outline:2px solid var(--accent);outline-offset:-2px}
.sw{width:10px;height:10px;border-radius:2px;border:1px solid rgba(0,0,0,.18)}
.nm{min-width:0}
.nm b{display:block;font-weight:500;font-size:13px;white-space:nowrap;
  overflow:hidden;text-overflow:ellipsis}
.nm span{display:block;font-family:"IBM Plex Mono",ui-monospace,monospace;
  font-size:10.5px;color:var(--ink-3);font-variant-numeric:tabular-nums}
.qty{font-family:"IBM Plex Mono",ui-monospace,monospace;font-size:11px;color:var(--ink-3);
  font-variant-numeric:tabular-nums}
.row.off .nm b,.row.off .nm span,.row.off .qty{color:var(--ink-3);opacity:.55}
.row.off .sw{opacity:.3}
.stage{position:relative;min-height:0;
  background:radial-gradient(circle at 50% 38%,var(--canvas-a),var(--canvas-b))}
canvas{display:block;width:100%;height:100%;touch-action:none}
.hint{position:absolute;left:14px;bottom:12px;font-family:"IBM Plex Mono",ui-monospace,monospace;
  font-size:10.5px;color:var(--ink-3);letter-spacing:.02em;pointer-events:none}
.readout{position:absolute;right:14px;top:12px;background:var(--surface);
  border:1px solid var(--rule);border-radius:3px;padding:7px 11px;box-shadow:var(--shadow);
  font-family:"IBM Plex Mono",ui-monospace,monospace;font-size:11px;color:var(--ink-2);
  font-variant-numeric:tabular-nums;min-width:112px}
.readout b{color:var(--ink);font-weight:500}
</style>
<div class="app">
  <aside class="side">
    <div class="head">
      <p class="eyebrow" id="eyebrow"></p>
      <h1 id="title"></h1>
      <div class="dims" id="dims"></div>
    </div>
    <div class="tools">
      <div class="presets">
        <button class="preset" data-preset="all" data-ui="all">All</button>
        <button class="preset" data-preset="printed" data-ui="printed">Printed only</button>
        <button class="preset" data-preset="inside" data-ui="inside">Internals</button>
        <button class="preset" data-preset="cut" data-ui="cut">Cut open</button>
      </div>
      <div class="presets" id="grouptoggles"></div>
      <div class="slider">
        <label for="ex" data-ui="explode">Explode</label>
        <input id="ex" type="range" min="0" max="60" value="0" step="1">
        <output id="exv">0 mm</output>
      </div>
      <div class="slider">
        <label for="cutaxis" data-ui="section">Section</label>
        <select id="cutaxis" aria-label="Section axis" data-ui-aria="section_axis">
          <option value="" data-ui="off">off</option><option value="0">X</option><option value="1">Y</option><option value="2">Z</option>
        </select>
        <input id="cut" type="range" min="0" max="1000" value="500" step="1" disabled aria-label="Section position" data-ui-aria="section_pos">
        <button class="preset" id="cutflip" type="button" disabled title="Show the other side" data-ui-title="flip">⇄</button>
        <output id="cutv">–</output>
      </div>
    </div>
    <div class="list" id="list"></div>
  </aside>
  <div class="stage">
    <canvas id="cv"></canvas>
    <div class="readout" id="ro">–</div>
    <div class="hint" data-ui="hint">Drag = rotate · Wheel = zoom · Shift+drag = pan</div>
  </div>
</div>
<script>/*__DATA__*/</script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
(function(){
  var P = window.PART_DATA, M = P.meta;
  // UI texts: English defaults, VIEWER["ui"] in print_project.py can override single keys
  var UI = {all:'All', printed:'Printed only', inside:'Internals', cut:'Cut open', explode:'Explode',
    section:'Section', off:'off', flip:'Show the other side', section_axis:'Section axis', section_pos:'Section position',
    hint:'Drag = rotate · Wheel = zoom · Shift+drag = pan', of:'of', parts:'parts', triangles:'triangles', locale:'en-GB'};
  Object.keys(M.ui || {}).forEach(function(k){ UI[k] = M.ui[k]; });
  document.querySelectorAll('[data-ui]').forEach(function(el){ el.textContent = UI[el.dataset.ui]; });
  document.querySelectorAll('[data-ui-title]').forEach(function(el){ el.title = UI[el.dataset.uiTitle]; });
  document.querySelectorAll('[data-ui-aria]').forEach(function(el){ el.setAttribute('aria-label', UI[el.dataset.uiAria]); });
  document.getElementById('eyebrow').textContent = M.eyebrow;
  document.getElementById('title').textContent = M.title;
  var dims = document.getElementById('dims');
  M.dims.forEach(function(d){
    var el = document.createElement('div');
    el.innerHTML = '<span></span><b></b>';
    el.querySelector('span').textContent = d[0];
    el.querySelector('b').textContent = d[1];
    dims.appendChild(el);
  });
  function defaultOn(p){ return M.hidden_groups.indexOf(p.group) < 0; }

  function b64buf(s){
    var bin = atob(s), n = bin.length, u = new Uint8Array(n);
    for (var i=0;i<n;i++) u[i] = bin.charCodeAt(i);
    return u.buffer;
  }
  function stlGeom(buf){
    var dv = new DataView(buf), n = dv.getUint32(80, true);
    var pos = new Float32Array(n*9), nor = new Float32Array(n*9), o = 84;
    for (var i=0;i<n;i++){
      for (var v=0;v<3;v++){
        var b = o+12+v*12, k = i*9+v*3;
        pos[k]  = dv.getFloat32(b,true);
        pos[k+1]= dv.getFloat32(b+4,true);
        pos[k+2]= dv.getFloat32(b+8,true);
      }
      // flat normals from the corners instead of the file: always consistent
      var j=i*9, ax=pos[j+3]-pos[j], ay=pos[j+4]-pos[j+1], az=pos[j+5]-pos[j+2],
          bx=pos[j+6]-pos[j], by=pos[j+7]-pos[j+1], bz=pos[j+8]-pos[j+2],
          cx=ay*bz-az*by, cy=az*bx-ax*bz, cz=ax*by-ay*bx, l=Math.sqrt(cx*cx+cy*cy+cz*cz)||1;
      for (var v2=0;v2<3;v2++){ nor[j+v2*3]=cx/l; nor[j+v2*3+1]=cy/l; nor[j+v2*3+2]=cz/l; }
      o += 50;
    }
    var g = new THREE.BufferGeometry();
    g.setAttribute('position', new THREE.BufferAttribute(pos,3));
    g.setAttribute('normal', new THREE.BufferAttribute(nor,3));
    return g;
  }

  var size = Math.max(M.size, 20);
  var cv = document.getElementById('cv');
  var renderer = new THREE.WebGLRenderer({canvas:cv, antialias:true, alpha:true});
  renderer.setPixelRatio(Math.min(devicePixelRatio||1, 2));
  var scene = new THREE.Scene();
  var cam = new THREE.PerspectiveCamera(35, 1, size/200, size*30);

  scene.add(new THREE.HemisphereLight(0xffffff, 0x54626c, 0.85));
  var key = new THREE.DirectionalLight(0xffffff, 0.75); key.position.set(1.1,-1.4,1.6); scene.add(key);
  var fill = new THREE.DirectionalLight(0xffffff, 0.32); fill.position.set(-1.3,0.9,0.5); scene.add(fill);

  var root = new THREE.Group();
  root.rotation.x = -Math.PI/2;            // OpenSCAD Z is up
  root.position.set(-M.center[0], -M.center[2], M.center[1]);
  scene.add(root);

  var meshes = {};
  P.parts.forEach(function(p){
    var m = new THREE.MeshLambertMaterial({color:new THREE.Color(p.color)});
    var mesh = new THREE.Mesh(stlGeom(b64buf(p.stl)), m);
    mesh.visible = defaultOn(p);
    root.add(mesh); meshes[p.id]=mesh;
  });

  // ---- screens: drawn content on a plane just in front of a display body (VIEWER["screens"]) ----
  function rrect(ctx, x, y, w, h, r){
    r = Math.min(r, w/2, h/2);
    ctx.beginPath(); ctx.moveTo(x+r, y);
    ctx.arcTo(x+w, y, x+w, y+h, r); ctx.arcTo(x+w, y+h, x, y+h, r);
    ctx.arcTo(x, y+h, x, y, r); ctx.arcTo(x, y, x+w, y, r); ctx.closePath();
  }
  function drawScreen(ctx, W, H, s){
    var c = s.content || {}, k = W / s.size[0], pad = Math.round(H*0.07);
    var acc = c.accent || '#ff6a13', ink = c.ink || '#e6edf1', dim = c.dim || '#7f929e';
    var mono = '"IBM Plex Mono",ui-monospace,Menlo,monospace';
    ctx.clearRect(0, 0, W, H);
    ctx.save();
    rrect(ctx, 0, 0, W, H, (s.radius || 0)*k); ctx.clip();
    var bg = ctx.createLinearGradient(0, 0, 0, H);
    bg.addColorStop(0, c.bg_top || '#101a20'); bg.addColorStop(1, c.bg || '#030506');
    ctx.fillStyle = bg; ctx.fillRect(0, 0, W, H);
    var pillsH = c.pills ? H*0.17 : 0;
    if (c.layout === 'center'){
      ctx.textAlign = 'center';
      ctx.fillStyle = ink; ctx.font = '600 '+Math.round(H*0.2)+'px '+mono;
      ctx.fillText(c.title || '', W/2, H*0.42);
      ctx.fillStyle = acc; ctx.font = '500 '+Math.round(H*0.1)+'px '+mono;
      ctx.fillText(c.subtitle || '', W/2, H*0.6);
      ctx.textAlign = 'left';
    } else {
      ctx.fillStyle = acc; ctx.font = '600 '+Math.round(H*0.12)+'px '+mono;
      ctx.fillText(c.title || '', pad, pad + H*0.1);
      if (c.subtitle){
        ctx.fillStyle = dim; ctx.font = Math.round(H*0.065)+'px '+mono; ctx.textAlign = 'right';
        ctx.fillText(c.subtitle, W - pad, pad + H*0.09); ctx.textAlign = 'left';
      }
      var line = pad + H*0.15;
      ctx.fillStyle = acc; ctx.globalAlpha = 0.45; ctx.fillRect(pad, line, W - 2*pad, Math.max(1, H*0.005)); ctx.globalAlpha = 1;
      var rows = c.rows || [], top = line + H*0.03, rowH = (H - top - pad - pillsH) / Math.max(rows.length, 1);
      rows.forEach(function(r, i){
        var ry = top + i*rowH, fs = Math.round(Math.min(rowH*0.4, H*0.075));
        ctx.font = fs+'px '+mono;
        ctx.fillStyle = dim; ctx.fillText(r[0], pad, ry + fs*1.1);
        ctx.fillStyle = ink; ctx.textAlign = 'right'; ctx.fillText(r[1], W - pad, ry + fs*1.1); ctx.textAlign = 'left';
        if (r[2] != null){
          var by = ry + fs*1.45, bh = Math.max(2, rowH*0.16);
          ctx.fillStyle = 'rgba(255,255,255,0.09)'; ctx.fillRect(pad, by, W - 2*pad, bh);
          ctx.fillStyle = r[2] > 0.85 ? '#ff453a' : acc;
          ctx.fillRect(pad, by, (W - 2*pad)*Math.max(0, Math.min(1, r[2])), bh);
        }
      });
    }
    if (c.pills){
      var fsP = Math.round(pillsH*0.42), gap = pad*0.5;
      ctx.font = '500 '+fsP+'px '+mono;
      var widths = c.pills.map(function(p){ return ctx.measureText(p[0]).width + fsP*2.2; });
      var total = widths.reduce(function(a, b){ return a + b; }, 0) + gap*(widths.length - 1);
      var px = c.layout === 'center' ? (W - total)/2 : pad, py = H - pad - pillsH*0.8;
      c.pills.forEach(function(p, i){
        rrect(ctx, px, py, widths[i], pillsH*0.8, pillsH*0.4);
        ctx.fillStyle = 'rgba(255,255,255,0.08)'; ctx.fill();
        ctx.fillStyle = p[1] || acc; ctx.beginPath(); ctx.arc(px + fsP*0.8, py + pillsH*0.4, fsP*0.28, 0, Math.PI*2); ctx.fill();
        ctx.fillStyle = ink; ctx.fillText(p[0], px + fsP*1.4, py + pillsH*0.4 + fsP*0.36);
        px += widths[i] + gap;
      });
    }
    var sheen = ctx.createLinearGradient(0, 0, W*0.6, H);
    sheen.addColorStop(0, 'rgba(255,255,255,0.08)'); sheen.addColorStop(0.5, 'rgba(255,255,255,0)');
    ctx.fillStyle = sheen; ctx.fillRect(0, 0, W, H);
    ctx.restore();
  }
  var screens = (M.screens || []).map(function(s){
    var W = Math.round(s.size[0]*16), H = Math.round(s.size[1]*16);
    var cvs = document.createElement('canvas'); cvs.width = W; cvs.height = H;
    var tex = new THREE.CanvasTexture(cvs);
    tex.anisotropy = renderer.capabilities.getMaxAnisotropy();
    function paint(){ drawScreen(cvs.getContext('2d'), W, H, s); tex.needsUpdate = true; }
    paint();
    if (document.fonts && document.fonts.ready) document.fonts.ready.then(paint);
    setTimeout(paint, 1500);
    var mat = new THREE.MeshBasicMaterial({map: tex, transparent: true,
                                          polygonOffset: true, polygonOffsetFactor: -4, polygonOffsetUnits: -4});
    var mesh = new THREE.Mesh(new THREE.PlaneGeometry(s.size[0], s.size[1]), mat);
    var nz = new THREE.Vector3().fromArray(s.normal).normalize(), ny = new THREE.Vector3().fromArray(s.up).normalize();
    var nx = new THREE.Vector3().crossVectors(ny, nz);
    mesh.quaternion.setFromRotationMatrix(new THREE.Matrix4().makeBasis(nx, ny, nz));
    var base = new THREE.Vector3().fromArray(s.center).addScaledVector(nz, 0.15);
    var owner = P.parts.filter(function(p){ return p.id === s.body; })[0];
    mesh.position.copy(base); root.add(mesh);
    return {s: s, mesh: mesh, base: base, dir: new THREE.Vector3().fromArray(owner ? owner.dir : [0, 0, 0])};
  });
  function syncScreens(){
    screens.forEach(function(k){ var b = meshes[k.s.body]; k.mesh.visible = !!b && b.visible; });
  }

  // ---- camera orbit ----
  var rot = {th: -0.62, ph: 1.06}, dist = size*2.9, target = new THREE.Vector3(0,0,0);
  function place(){
    var s = Math.sin(rot.ph), c = Math.cos(rot.ph);
    cam.position.set(target.x + dist*s*Math.sin(rot.th),
                     target.y + dist*c,
                     target.z + dist*s*Math.cos(rot.th));
    cam.lookAt(target);
  }
  var drag=null;
  cv.addEventListener('pointerdown', function(e){
    drag={x:e.clientX, y:e.clientY, pan:e.shiftKey||e.button===1};
    cv.setPointerCapture(e.pointerId);
  });
  cv.addEventListener('pointermove', function(e){
    if(!drag) return;
    var dx=e.clientX-drag.x, dy=e.clientY-drag.y;
    drag.x=e.clientX; drag.y=e.clientY;
    if(drag.pan){
      var right=new THREE.Vector3(), up=new THREE.Vector3();
      cam.matrixWorld.extractBasis(right, up, new THREE.Vector3());
      var k = dist*0.0016;
      target.addScaledVector(right, -dx*k).addScaledVector(up, dy*k);
    } else {
      rot.th -= dx*0.008;
      rot.ph = Math.max(0.08, Math.min(Math.PI-0.08, rot.ph - dy*0.008));
    }
    place();
  });
  function end(e){ if(drag){ drag=null; try{cv.releasePointerCapture(e.pointerId);}catch(_){} } }
  cv.addEventListener('pointerup', end);
  cv.addEventListener('pointercancel', end);
  cv.addEventListener('wheel', function(e){
    e.preventDefault();
    dist = Math.max(size*0.75, Math.min(size*9, dist * (1 + (e.deltaY>0?0.11:-0.11))));
    place();
  }, {passive:false});

  function resize(){
    var r = cv.getBoundingClientRect();
    renderer.setSize(r.width, r.height, false);
    cam.aspect = r.width/Math.max(1,r.height); cam.updateProjectionMatrix();
  }
  addEventListener('resize', resize);

  // ---- part list ----
  var list = document.getElementById('list');
  M.groups.forEach(function(g){
    var rows = P.parts.filter(function(p){return p.group===g[0];});
    if (!rows.length) return;
    var h=document.createElement('div'); h.className='grouphead'; h.textContent=g[1];
    list.appendChild(h);
    rows.forEach(function(p){
      var row=document.createElement('label'); row.className='row'; row.dataset.id=p.id;
      var on = defaultOn(p);
      row.innerHTML='<input type="checkbox"'+(on?' checked':'')+'>'+
        '<span class="sw"></span><span class="nm"><b></b><span></span></span><span class="qty"></span>';
      row.querySelector('.sw').style.background = p.color;
      row.querySelector('.nm b').textContent = p.label;
      row.querySelector('.nm span').textContent = p.ext;
      row.querySelector('.qty').textContent = p.qty;
      row.classList.toggle('off', !on);
      row.querySelector('input').addEventListener('change', function(){
        meshes[p.id].visible = this.checked;
        row.classList.toggle('off', !this.checked);
        count();
      });
      list.appendChild(row);
    });
  });

  // one on/off button per group named in VIEWER["toggle_groups"], next to the presets
  (M.toggle_groups || []).forEach(function(gid){
    var g = M.groups.filter(function(x){ return x[0] === gid; })[0];
    if (!g || !P.parts.some(function(p){ return p.group === gid; })) return;
    var b = document.createElement('button');
    b.className = 'preset'; b.type = 'button'; b.textContent = g[1];
    b.addEventListener('click', function(){
      var rows = P.parts.filter(function(p){ return p.group === gid; });
      var on = rows.some(function(p){ return meshes[p.id].visible; });
      rows.forEach(function(p){
        meshes[p.id].visible = !on;
        var row = list.querySelector('.row[data-id="' + p.id + '"]');
        if (row){ row.querySelector('input').checked = !on; row.classList.toggle('off', on); }
      });
      b.classList.toggle('off', on);
      count();
    });
    document.getElementById('grouptoggles').appendChild(b);
  });

  // swap buttons from VIEWER["swaps"]: (label, ids shown after the first click, ids hidden then), e.g. a folded and a raised handle
  // the chosen alternative survives the presets ("All", "Cut open" ...): enforceSwaps() runs after every preset
  var swapStates = [];
  function showPart(id, v){
    meshes[id].visible = v;
    var row = list.querySelector('.row[data-id="' + id + '"]');
    if (row){ row.querySelector('input').checked = v; row.classList.toggle('off', !v); }
  }
  function enforceSwaps(){
    swapStates.forEach(function(st){
      var any = st.s[1].concat(st.s[2]).some(function(id){ return meshes[id].visible; });
      if (!any) return;
      st.s[1].forEach(function(id){ showPart(id, st.on); });
      st.s[2].forEach(function(id){ showPart(id, !st.on); });
    });
  }
  (M.swaps || []).forEach(function(s){
    var ids = P.parts.map(function(p){ return p.id; });
    if (!s[1].concat(s[2]).every(function(id){ return ids.indexOf(id) >= 0; })) return;
    var st = {s: s, on: false};
    swapStates.push(st);
    var b = document.createElement('button');
    b.className = 'preset off'; b.type = 'button'; b.textContent = s[0];
    b.addEventListener('click', function(){
      st.on = !st.on;
      s[1].forEach(function(id){ showPart(id, st.on); });
      s[2].forEach(function(id){ showPart(id, !st.on); });
      b.classList.toggle('off', !st.on);
      count();
    });
    document.getElementById('grouptoggles').appendChild(b);
  });

  var ro = document.getElementById('ro');
  function count(){
    var on=0, tris=0;
    P.parts.forEach(function(p){ if(meshes[p.id].visible){ on++; tris+=p.tris; } });
    syncScreens();
    ro.innerHTML = '<b>'+on+'</b> '+UI.of+' '+P.parts.length+' '+UI.parts+'<br>'+tris.toLocaleString(UI.locale)+' '+UI.triangles;
  }

  function setVisible(fn){
    P.parts.forEach(function(p){
      var v = fn(p);
      meshes[p.id].visible = v;
      var row = list.querySelector('.row[data-id="'+p.id+'"]');
      if (row){ row.querySelector('input').checked = v; row.classList.toggle('off', !v); }
    });
    enforceSwaps();
    count();
  }
  document.querySelectorAll('.preset').forEach(function(b){
    b.addEventListener('click', function(){
      var k=b.dataset.preset;
      if(k==='all')     setVisible(function(){return true;});
      if(k==='printed') setVisible(defaultOn);
      if(k==='inside')  setVisible(function(p){return M.outer.indexOf(p.body)<0;});
      if(k==='cut')     setVisible(function(p){return M.cut.indexOf(p.body)<0;});
    });
  });

  // ---- explosion ----
  var ex = document.getElementById('ex'), exv = document.getElementById('exv');
  ex.addEventListener('input', function(){
    var e = +ex.value; exv.textContent = e+' mm';
    P.parts.forEach(function(p){ meshes[p.id].position.set(p.dir[0]*e, p.dir[1]*e, p.dir[2]*e); });
    screens.forEach(function(k){ k.mesh.position.copy(k.base).addScaledVector(k.dir, e); });
  });

  // ---- section: clip everything at a plane across one model axis, to look into closed housings ----
  renderer.localClippingEnabled = true;
  var lo = M.bounds ? M.bounds[0] : M.center.map(function(c){ return c - size/2; }),
      hi = M.bounds ? M.bounds[1] : M.center.map(function(c){ return c + size/2; });
  var planes = [];
  scene.traverse(function(o){
    if (o.material){ o.material.side = THREE.DoubleSide; o.material.clippingPlanes = planes; }
  });
  var cutAxis = document.getElementById('cutaxis'), cut = document.getElementById('cut'),
      cutv = document.getElementById('cutv'), cutFlip = document.getElementById('cutflip'), flip = false;
  function section(){
    var a = cutAxis.value;
    cut.disabled = cutFlip.disabled = (a === '');
    planes.length = 0;
    if (a === ''){ cutv.textContent = '–'; return; }
    a = +a;
    var v = lo[a] + (hi[a] - lo[a]) * cut.value / 1000, n = new THREE.Vector3();
    n.setComponent(a, flip ? -1 : 1);                 // keeps the side where the model coordinate is >= v (or <= v)
    root.updateMatrixWorld();
    planes.push(new THREE.Plane(n, flip ? v : -v).applyMatrix4(root.matrixWorld));
    cutv.textContent = v.toFixed(0) + ' mm';
  }
  cutAxis.addEventListener('change', section);
  cut.addEventListener('input', section);
  cutFlip.addEventListener('click', function(){ flip = !flip; section(); });

  resize(); place(); count();
  (function loop(){ renderer.render(scene,cam); requestAnimationFrame(loop); })();
})();
</script>
