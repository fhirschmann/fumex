    ["black", "Printed · PETG black"], ["grey", "Printed · PETG grey"],
    ["tpu", "Printed · TPU"], ["bought", "Bought parts"],
]
hidden_groups = ["bought"]
outer = ["head", "head_back", "base", "cassette"]
cut = ["head", "base"]
