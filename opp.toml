# opp project file (openscad-print-project): the static settings of FUMEX. Each key is a print_project.py setting in
# lower case (reference/project-file.md); print_project.py adds the tipping-check masses and checks(ctx). Package
# defaults are left out: printer H2S (Engineering Plate), process except the infill, folders, metrics tag, TPU solid.

[project]
status = "finished"   # active | finished: printed and in use, opp upgrade leaves it on its version
finished = 2026-10-07
source = "fumex.scad"
full_infill = ["filter_support", "chg_holder"]
# The fan and the pot are solid envelopes, their screws and shaft run through them
allowed_overlaps = [
    ["base", "screws_pwm"],           # thread forms into the pilot; independently bounded by check_pwm_mount
    ["head", "filter_support"],       # only the eight spring bumps, bounded by check_filter_support
    # PCB is fastened before the head, filter and cover assembly is installed.
    ["head", "driver_pwm"], ["filter", "driver_pwm"], ["cassette", "driver_pwm"],
    ["screws_cassette", "driver_pwm"],  # removed with the cassette before head/PWM service
    # PWM service removes the complete head and all four head screws first.
    ["screws_head", "driver_pwm"], ["driver_head", "driver_pwm"],
    ["filter_support", "driver_pwm"], ["fan", "driver_pwm"],
    ["driver_fan", "driver_pwm"], ["driver_back", "driver_pwm"],
    ["fan", "screws_fan"],            # screws run through the holes of the solid fan envelope
    ["knob", "pot"],                  # the slotted sleeve is a press fit on the knurled shaft
    # The drivers are checked against the state of the build at the moment that screw is
    # driven, not against the finished assembly: remove cassette and back/fan assembly
    # for the front/rear head screws; close the ballast lid before fitting the head.
    ["head_back", "driver_head"], ["cassette", "driver_head"], ["filter", "driver_head"],
    ["screws_cassette", "driver_head"],
    # Local flexible-mat contacts are bounded by check_front_mat_contact.
    ["head", "filter"], ["screws_head", "filter"],
    ["driver_back", "driver_head"], ["head_back", "driver_lid"], ["head", "driver_lid"],
    ["fan", "driver_lid"],            # the whole head group is removed before servicing the lid
    ["driver_fan", "driver_head"], ["driver_head", "driver_lid"],
    # and the fan is screwed to the cover on the bench, where its front face is reachable,
    # before either of them goes into the head
    ["head", "driver_fan"], ["cassette", "driver_fan"], ["filter", "driver_fan"],
    ["screws_cassette", "driver_fan"],
    ["screws_back", "driver_lid"], ["driver_back", "driver_lid"],
]
filaments = [
    { material = "PETG-black", profile = "Generic PETG @BBL H2S", colour = "#1A1B1D" },
    { material = "PETG-grey", profile = "Generic PETG @BBL H2S", colour = "#8C9196" },
    { material = "TPU", profile = "Generic TPU @BBL H2S", colour = "#1A1B1D" },
    # Logical inlay slot; map it to the same dark PETG spool as the housing.
    { material = "PETG-black", profile = "Generic PETG @BBL H2S", inlay = "pointer", colour = "#1A1B1D" },
]
project_3mf = "stl/fumex_all_parts.3mf"
test_3mf = "stl/fumex_usb_fit.3mf"
test_filament = 1
limitations = [
    "Hardware envelopes, not detailed vendor CAD",
    """Most service motions are sampled; USB insertion and front ratchet translations use continuous sweeps; \
    ratchet swing is bounded between samples""",
    """No flexible deformation, strength or thermal simulation; physical fit was confirmed on the printed build \
    (2026-10-07)""",
    "Tipping margin uses estimated part masses and the static centre of mass only",
    "Filter pressure drop and capture distance are not modelled",
    """The mat is compressible: it is pressed in and pulled out past the intake lip, which a
                rigid-body path check cannot show""",   # line break and indent kept as before
]
# opp all: analyses after every export (entries: command or [command, *options])
analyze = ["islands", "overhangs", "thickness", "fins", "inlays"]

# Print parts: name = [quantity in the full build, material, body count]. Quantity 0 = optional test print.
# Must match the part branches in the source exactly (checked). One material key per colour, same keys in filaments.
[parts]
base = [1, "PETG-black", 1]
head = [1, "PETG-grey", 1]
head_back = [1, "PETG-grey", 1]
cassette = [1, "PETG-grey", 1]
knob = [1, "PETG-grey", 1]
foot = [4, "TPU", 1]
ball_lid = [1, "PETG-grey", 1]
filter_support = [1, "PETG-grey", 1]
chg_holder = [1, "PETG-grey", 1]
usbc_fit_base = [0, "PETG-black", 1]
usbc_fit_lid = [0, "PETG-black", 1]

# World -> print rotations: the print STLs must be rotated, not mirrored, copies of the installed bodies.
[print_poses]
chg_holder = [[1, 0, 0], [0, 0, 1], [0, -1, 0]]   # back plate on the bed
ball_lid = [[1, 0, 0], [0, 1, 0], [0, 0, 1]]

# Assembly bodies in installed position: name = OpenSCAD call. Every pair is checked for overlap.
[assembly]
base = "base();"
head = "head();"
head_back = "head_back();"
cassette = "cassette();"
knob = "knob();"
feet = "place_feet();"
ball_lid = "ball_lid();"
fan = "fan_env();"
filter = "filter_env();"
filter_support = "filter_support();"
battery = "battery_env();"
battery_ties = "battery_ties_env();"
pwm_board = "pwm_board_env();"
pot = "pot_env();"
chg_module = "chg_module_env();"
chg_sink = "chg_sink_env();"
chg_tie = "chg_tie_env();"
chg_holder = "chg_holder();"
usbc = "usbc_env();"
switch = "sw_env();"
led = "led_env();"
ballast = "ballast_env();"
screws_cassette = "screws_cassette();"
screws_fan = "screws_fan();"
screws_back = "screws_back();"
screws_head = "screws_head();"
screws_lid = "screws_lid();"
screws_feet = "screws_feet();"
screws_pwm = "screws_pwm();"
# A bit and its holder on every screw head. These must not touch anything, which is the whole check.
driver_cassette = "drivers_cassette();"
driver_fan = "drivers_fan();"
driver_back = "drivers_back();"
driver_head = "drivers_head();"
driver_feet = "drivers_feet();"
driver_lid = "drivers_lid();"
driver_pwm = "drivers_pwm();"

# The grey knob has a flush pointer in the dark housing filament.
[color_parts]
knob = ["pointer"]

# Only the infill differs from the package process; the tipping-check PETG density assumes these 20 % gyroid.
[process]
infill = 20

# The cassette uses accessible screw/insert fasteners: no embedded hardware, no pauses (checked)
[pauses]

[plates]
Head = ["head"]
Base = ["base"]
Cassette = ["cassette"]
"Grey covers and support" = ["head_back", "ball_lid", "filter_support", "chg_holder"]
Knob = ["knob"]
"TPU feet" = ["foot"]

# Use fresh areas of a fully 3DLAC-coated bed across successive jobs. Remove
# finished parts and purge debris between jobs; keep the saved XY positions.
[bed_reuse]
batches = [["Head", "Base", "Cassette"], ["Grey covers and support", "Knob", "TPU feet"]]
clearance_mm = 5

[bed_reuse.placements]
Head = { min_xy = [15, 160] }
Base = { min_xy = [15, 45] }
Cassette = { min_xy = [180, 160] }
"Grey covers and support" = { min_xy = [15, 35] }
Knob = { min_xy = [265, 35], prime_tower_xy = [245, 90] }
"TPU feet" = { min_xy = [255, 220] }

[test_plates]
"USB insertion fit" = ["usbc_fit_base", "usbc_fit_lid"]

[viewer]
title = "FUMEX"
page_title = "FUMEX solder fume extractor"
eyebrow = "Assembly · installed position"
dims = [["Width", "145"], ["Depth", "114"], ["Height", "202"]]
# Viewer greys, not the filament colours: black PETG has no shading contrast on screen and the
# geometry disappears (user, 2026-09-22). The plate and filament names keep the real colours.
